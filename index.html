<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>To-Do List</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <h1 class="app-title">To-Do List</h1>
        <!-- Auth Section -->
   <div id="auth-section" class="auth-section">
      <form id="auth-form" class="auth-form">
        <input type="email" id="email-input" placeholder="Email" autocomplete="email" required />
        <input type="password" id="password-input" placeholder="Password" autocomplete="current-password" required />
        <div class="auth-actions">
          <button type="submit" id="signin-btn" class="btn btn-primary">Sign In</button>
          <button type="button" id="signup-btn" class="btn btn-text">Sign Up</button>
        </div>
      </form>
      <p id="auth-status"></p>
    </div>

    <!-- Signed-in view -->
    <div id="app-section" class="app-section" style="display: none;">
      <div class="user-bar">
        <span id="user-email"></span>
        <button id="signout-btn" class="btn btn-text">Sign Out</button>
      </div> 
      
    <!-- Add Task Form -->
    <form id="task-form" class="task-form">
      <label for="task-input" class="visually-hidden">New tsk</label>
      <input
        type="text"
        id="task-input"
        placeholder="What needs to be done?"
        autocomplete="off"
      />
      <button type="submit" class="btn btn-primary">Add</button>
    </form>

    <!-- Filters -->
    <div class="filters" role="tablist" aria-label="Filter tasks">
      <button class="filter-btn is-active" data-filter="all" role="tab" aria-selected="true">All</button>
      <button class="filter-btn" data-filter="active" role="tab" aria-selected="false">Active</button>
      <button class="filter-btn" data-filter="completed" role="tab" aria-selected="false">Completed</button>
    </div>

    <!-- Task List -->
    <ul id="task-list" class="task-list"></ul>

    <!-- Empty State -->
    <p id="empty-state" class="empty-state">No tasks yet. Add one above!</p>

    <!-- Footer -->
    <div class="list-footer">
      <span id="items-left">0 items left</span>
      <button id="clear-completed" class="btn btn-text">Clear completed</button>
    </div>
    </div>
  </main>

  <!-- Edit Dialog -->
  <div id="edit-dialog" class="dialog-overlay" aria-hidden="true">
    <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="edit-dialog-title">
      <h2 id="edit-dialog-title">Edit task</h2>
      <form id="edit-form">
        <label for="edit-input" class="visually-hidden">Edit task text</label>
        <input type="text" id="edit-input" autocomplete="off" />
        <div class="dialog-actions">
          <button type="button" id="cancel-edit" class="btn btn-text">Cancel</button>
          <button type="submit" class="btn btn-primary">Save</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="client.js"></script>
  <script type="module" src="script.js"></script>
</body>
</html>
